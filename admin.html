<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>UIKIMODDER Admin Studio</title><link rel="stylesheet" href="style.css"><style>body{padding:24px;background:#080b1c;color:white;font-family:Outfit,Arial}.admin-wrap{max-width:850px;margin:auto}.panel{background:#11172d;border:1px solid #344264;border-radius:18px;padding:22px;margin:20px 0}label{display:block;margin:14px 0 6px}input,textarea,select{display:block;width:100%;padding:12px;margin:6px 0;background:#080e20;color:white;border:1px solid #344264;border-radius:9px}textarea{min-height:100px}button{padding:12px 20px;border:0;border-radius:9px;background:#00d9ef;color:#06101c;font-weight:bold}#status{white-space:pre-wrap}.row{margin:12px 0;padding:12px;border:1px solid #344264;border-radius:10px}.muted{color:#9aa8c7}</style></head><body><main class="admin-wrap"><h1>UIKIMODDER <span style="color:#00d9ef">Admin Studio</span></h1><p class="muted">Private game and app publishing dashboard</p><button id="signOutBtn" type="button">Sign Out</button><section class="panel"><h2>Publish new game / app</h2><form id="uploadForm"><label>Type</label><select id="type"><option value="game">Game</option><option value="app">App</option></select><label>Name</label><input id="name" maxlength="80" required><label>Description</label><textarea id="description" maxlength="1200" required></textarea><label>Category</label><select id="category"><option>Action</option><option>Adventure</option><option>Racing</option><option>Puzzle</option><option>Other</option></select><label>Game / App package</label><input id="package" type="file" required><p class="muted">Maximum package size: 500 MB.</p><label>Screenshot 1</label><input id="shot1" type="file" accept="image/*" required><label>Screenshot 2</label><input id="shot2" type="file" accept="image/*" required><button id="uploadBtn" type="submit">UPLOAD & PUBLISH</button><p id="status" role="status"></p></form></section><section class="panel"><h2>Published items</h2><div id="items">Loading…</div></section></main><script type="module" src="js/admin.js"></script></body></html>
